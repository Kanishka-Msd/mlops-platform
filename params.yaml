data:
  raw_path: data/adult.csv
  processed_path: data/processed.csv
  test_size: 0.2
  random_state: 42

model:
  random_forest:
    n_estimators: 200
    max_depth: 15
    min_samples_split: 5
    random_state: 42

  xgboost:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    random_state: 42